---

# jenkins variables
project_name: docker-openshot
external_type: na
custom_version_command: "curl -sX GET http://ppa.launchpad.net/openshot.developers/ppa/ubuntu/dists/resolute/main/binary-amd64/Packages.gz | gunzip |grep -A 7 -m 1 'Package: openshot-qt' | awk -F ': ' '/Version/{print $2;exit}'"
release_type: stable
release_tag: latest
ls_branch: main
repo_vars:
  - BUILD_VERSION_ARG = 'OPENSHOT_VERSION'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-openshot'
  - CONTAINER_NAME = 'openshot'
  - DOCKERHUB_IMAGE = 'linuxserver/openshot'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/openshot'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/openshot'
  - DIST_IMAGE = 'ubuntu'
  - MULTIARCH = 'false'
  - CI = 'true'
  - CI_WEB = 'true'
  - CI_PORT = '3001'
  - CI_SSL = 'true'
  - CI_DELAY = '120'
  - CI_DOCKERENV = ''
  - CI_AUTH = ''
  - CI_WEBPATH = ''
sponsor_links:
  - { name: "OpenShot", url: "https://www.openshot.org/donate/" }
